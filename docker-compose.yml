services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waferlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waferlens}
      POSTGRES_DB: ${POSTGRES_DB:-waferlens}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana-oss:11.4.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-waferlens}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_reader}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_reader}
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-state:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Receives Grafana alert notifications and logs them: `docker compose logs alert-sink`.
  alert-sink:
    image: mendhak/http-https-echo:35
    environment:
      HTTP_PORT: 8080
      LOG_IGNORE_PATH: /health

  # Server-side rendering for `make screenshots`; only started with the screenshots profile.
  renderer:
    image: grafana/grafana-image-renderer:3.12.1
    profiles: [screenshots]

  # Experiment tracking + model registry for the SECOM fail model (phase 5b). Runs and the
  # registry live in SQLite, artifacts on the volume; clients upload them through the server.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --allowed-hosts localhost:*,127.0.0.1:*,mlflow:*
    environment:
      MLFLOW_DISABLE_TELEMETRY: "true"
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-state:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 24

  # Wafer-map pattern classifier from the sister project, built from its GitHub repo at a
  # pinned commit (the ONNX model and calibration are in that repo). Phase 5a.
  fabeye:
    build:
      context: https://github.com/anson10/FabEye.git#004be79af408ad99025c3431ed19d85f5e7ba5e8
    image: waferlens/fabeye:004be79
    environment:
      WAFER_API_KEY: ${FABEYE_API_KEY:-change-me}
      ORT_THREADS: "4"
    ports:
      - "${FABEYE_PORT:-8000}:8000"

volumes:
  timescale-data:
  grafana-state:
  mlflow-state:
