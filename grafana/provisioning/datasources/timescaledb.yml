apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: waferlens-timescaledb
    type: grafana-postgresql-datasource
    url: db:5432
    # Read-only role from migration 0006: dashboards can never change data.
    user: $GRAFANA_DB_USER
    isDefault: true
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
