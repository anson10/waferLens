waferlens:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5432') | as_number }}"
      user: "{{ env_var('DBT_USER', 'waferlens') }}"
      password: "{{ env_var('DBT_PASSWORD', 'waferlens') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'waferlens') }}"
      schema: public
      threads: 4
