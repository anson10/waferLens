version: 2

models:
  # ------------------------------------------------------------------ facts
  - name: fct_measurements
    description: >
      Sensor readings and metrology wafer means at one grain (wafer x route step x pass x
      parameter), each tied to the chamber, recipe and lot of that step. Incremental.
    columns:
      - name: measurement_key
        data_tests: [unique, not_null]
      - name: source
        data_tests:
          - accepted_values:
              arguments: {values: [sensor, metrology]}
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}
      - name: wafer_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_wafer'), field: wafer_id}
      - name: lot_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_lot'), field: lot_id}
      - name: route_step_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_route_step'), field: route_step_id}
      - name: parameter_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_parameter'), field: parameter_id}
      - name: chamber_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_chamber'), field: chamber_id}
      - name: recipe_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_recipe'), field: recipe_id}
      - name: n_sites
        description: 1 for sensors, sites averaged for metrology.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 9}
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(source = 'sensor') = (target is null)"
          config:
            description: Only metrology rows carry spec limits.

  - name: fct_wafer_yield
    description: One row per sorted wafer with dies tested, good dies, yield and cycle time.
    columns:
      - name: wafer_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments: {to: ref('dim_wafer'), field: wafer_id}
      - name: lot_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_lot'), field: lot_id}
      - name: product_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_product'), field: product_id}
      - name: tested_date_key
        data_tests:
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}
      - name: yield_pct
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: cycle_time_days
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
    data_tests:
      - dbt_utils.expression_is_true:
          arguments: {expression: "good_dies <= tested_dies"}
      - dbt_utils.expression_is_true:
          arguments: {expression: "finished_at <= tested_at"}

  - name: fct_wafer_steps
    description: One row per wafer x route step x pass with chamber, recipe, queue and process time.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [wafer_id, route_step_id, pass_no]}
      - dbt_utils.expression_is_true:
          arguments: {expression: "is_rework = (pass_no > 1)"}
    columns:
      - name: wafer_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_wafer'), field: wafer_id}
      - name: chamber_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_chamber'), field: chamber_id}
      - name: recipe_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_recipe'), field: recipe_id}
      - name: route_step_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_route_step'), field: route_step_id}
      - name: date_key
        data_tests:
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}
      - name: process_minutes
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}

  - name: fct_die_bins
    description: One row per sorted wafer x bin, with the bin's share of the wafer.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [wafer_id, bin_code]}
    columns:
      - name: wafer_id
        data_tests:
          - relationships:
              arguments: {to: ref('fct_wafer_yield'), field: wafer_id}
      - name: lot_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_lot'), field: lot_id}
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_product'), field: product_id}
      - name: bin_code
        data_tests:
          - relationships:
              arguments: {to: ref('dim_sort_bin'), field: bin_code}
      - name: share_of_wafer
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}

  - name: dim_excursion
    description: >
      One row per injected excursion: type, cause (chamber, recipe), affected sensor, spatial
      pattern as FabEye names it, magnitude and window. The shared dimension of the
      excursion-grain facts.
    columns:
      - name: excursion_id
        data_tests: [unique, not_null]
      - name: start_date_key
        data_tests:
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}

  - name: fct_wafer_pattern
    description: >
      One row per sorted wafer with FabEye's predicted WM-811K pattern, confidence, review
      flag and conformal prediction set, next to the simulator's true pattern.
    columns:
      - name: wafer_id
        data_tests: [unique, not_null]
      - name: predicted_pattern
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('wafer_pattern_classes'), field: pattern}
      - name: true_pattern
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('wafer_pattern_classes'), field: pattern}
      - name: confidence
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: prediction_set_size
        description: >
          Classes in FabEye's conformal set. 0 is valid: no class cleared its threshold, a sign
          the map looks unlike anything FabEye was calibrated on.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}

  - name: fct_pattern_alarms
    description: >
      One row per wafer whose sort result raised a wafer-map pattern alarm: at least
      max(3, 3 x background per day) auto-accepted wafers with the same FabEye pattern sorted
      within 24 hours, background from the first 30 days.
    columns:
      - name: wafer_id
        data_tests: [unique, not_null]
      - name: pattern
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('wafer_pattern_classes'), field: pattern}
      - name: wafers_24h
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 3}

  - name: fct_pattern_detection
    description: >
      One row per injected spatial-pattern excursion: whether the wafer-map pattern alarm
      caught it, the delay from the excursion's start (and the sort lag that bounds it), a
      placebo window before it, and whether SPC caught it.
    columns:
      - name: excursion_id
        data_tests: [unique, not_null]
      - name: delay_hours
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}

  - name: fct_spc_alarms
    description: >
      One row per SPC alarm (a point that signalled on one chart of one series), with its
      series scope, chamber, parameter, wafer, lot and product. Written by waferlens.spc.
    columns:
      - name: alarm_id
        data_tests: [unique, not_null]
      - name: chart_family
        description: shewhart, memory or multivariate (from the spc_charts seed).
        data_tests:
          - accepted_values:
              arguments: {values: [shewhart, memory, multivariate]}
      - name: scope
        data_tests:
          - accepted_values:
              arguments: {values: [chamber, tool]}
      - name: chamber_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_chamber'), field: chamber_id}
      - name: parameter_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_parameter'), field: parameter_id}
      - name: wafer_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_wafer'), field: wafer_id}
      - name: date_key
        data_tests:
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}
    data_tests:
      - dbt_utils.expression_is_true:
          arguments: {expression: "measured_at >= baseline_end_at"}
          config:
            description: Alarms are Phase II only, raised after the series' baseline window.
      - dbt_utils.expression_is_true:
          arguments: {expression: "(chart = 't2') = (parameter_id is null)"}

  - name: fct_excursion_detection
    description: >
      One row per injected excursion x SPC chart x scope, scoring Phase II SPC against the
      simulator's ground truth: detected or not, delay in hours and affected points, a placebo
      window before the excursion, and whether it started inside the baseline window.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [excursion_id, chart, scope]}
      - dbt_utils.expression_is_true:
          arguments: {expression: "detected = (first_alarm_at is not null)"}
      - dbt_utils.expression_is_true:
          arguments: {expression: "not detected or (delay_hours >= 0 and delay_points >= 1)"}
      - dbt_utils.expression_is_true:
          arguments: {expression: "placebo_alarm = (placebo_delay_points >= 1)"}
      - dbt_utils.expression_is_true:
          arguments: {expression: "placebo_delay_points <= placebo_window_points"}
      - dbt_utils.expression_is_true:
          arguments: {expression: "excursion_type <> 'spatial_pattern' or not monitored"}
          config:
            description: Spatial patterns change no sensor or metrology value, so no chart watches them.
    columns:
      - name: excursion_type
        data_tests:
          - accepted_values:
              arguments: {values: [step_shift, drift, chamber_offset, recipe_change, spatial_pattern]}
      - name: scope
        data_tests:
          - accepted_values:
              arguments: {values: [chamber, tool]}

  - name: fct_excursion_impact
    description: >
      One row per injected excursion: affected wafers, their yield against same-product wafers
      processed in the same window that escaped it, and the dies lost.
    columns:
      - name: excursion_id
        data_tests: [unique, not_null]
      - name: affected_wafers
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}

  - name: fct_root_cause_candidates
    description: Ranked suspects (chambers, recipe versions) per excursion window, with the true cause flagged.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [excursion_id, signal, factor_type, chamber_id, recipe_id]}
    columns:
      - name: candidate_id
        data_tests: [unique, not_null]
      - name: suspect
        data_tests: [not_null]
      - name: suspect_rank
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}

  - name: fct_root_cause_eval
    description: One row per excursion with the true cause's rank (top-1 / top-3) and its yield impact.
    columns:
      - name: excursion_id
        data_tests: [unique, not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments: {expression: "not top1 or top3"}
      - dbt_utils.expression_is_true:
          arguments: {expression: "true_rank is null or true_rank <= candidates"}

  # ------------------------------------------------------------------ dimensions
  - name: dim_date
    description: Calendar days (UTC) covering the data; Power BI's date table.
    columns:
      - name: date_key
        data_tests: [unique, not_null]
      - name: calendar_date
        data_tests: [unique, not_null]

  - name: dim_node
    description: Technology nodes (28nm, 65nm, 130nm).
    columns:
      - name: node_id
        data_tests: [unique, not_null]

  - name: dim_product
    description: Products with their node flattened in (die area, map size, gross dies).
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: node_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_node'), field: node_id}

  - name: dim_route_step
    description: Steps of each product's route, with the tool type and whether metrology follows.
    columns:
      - name: route_step_id
        data_tests: [unique, not_null]
      - name: product_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_product'), field: product_id}

  - name: dim_tool
    description: Tools with their type and chamber count.
    columns:
      - name: tool_id
        data_tests: [unique, not_null]
      - name: chamber_count
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1}

  - name: dim_chamber
    description: Chambers with tool and tool type flattened in; labelled like ETCH-02/B.
    columns:
      - name: chamber_id
        data_tests: [unique, not_null]
      - name: chamber_label
        data_tests: [unique, not_null]
      - name: tool_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_tool'), field: tool_id}

  - name: dim_recipe
    description: Recipe versions with the window each was in force (lead over versions).
    columns:
      - name: recipe_id
        data_tests: [unique, not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments: {expression: "effective_to_at is null or effective_to_at > effective_from_at"}
      - dbt_utils.expression_is_true:
          arguments: {expression: "is_current = (effective_to_at is null)"}

  - name: dim_parameter
    description: Sensors and metrology parameters with units.
    columns:
      - name: parameter_id
        data_tests: [unique, not_null]
      - name: parameter_kind
        data_tests:
          - accepted_values:
              arguments: {values: [sensor, metrology]}

  - name: dim_sort_bin
    description: Wafer sort bins; bin 1 is the only pass bin.
    columns:
      - name: bin_code
        data_tests: [unique, not_null]

  - name: dim_lot
    description: Lots with split lineage (recursive CTE up parent_lot_id).
    columns:
      - name: lot_id
        data_tests: [unique, not_null]
      - name: root_lot_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_lot'), field: lot_id}
      - name: lot_status
        data_tests:
          - accepted_values:
              arguments: {values: [active, hold, complete, scrapped]}
    data_tests:
      - dbt_utils.expression_is_true:
          arguments: {expression: "(split_depth = 0) = (parent_lot_id is null)"}

  - name: dim_wafer
    description: Wafers with their current lot, product, slot and status.
    columns:
      - name: wafer_id
        data_tests: [unique, not_null]
      - name: lot_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_lot'), field: lot_id}
      - name: wafer_status
        data_tests:
          - accepted_values:
              arguments: {values: [active, complete, scrapped]}

unit_tests:
  - name: dim_recipe_versions_close_when_the_next_starts
    description: effective_to is the next version's start on the same step; the last is open.
    model: dim_recipe
    given:
      - input: ref('stg_recipes')
        rows:
          - {recipe_id: 1, route_step_id: 7, recipe_name: ETCH_A, recipe_version: 1, effective_from_at: "2026-01-01 00:00:00+00"}
          - {recipe_id: 9, route_step_id: 7, recipe_name: ETCH_A, recipe_version: 2, effective_from_at: "2026-02-01 00:00:00+00"}
          - {recipe_id: 12, route_step_id: 7, recipe_name: ETCH_A, recipe_version: 3, effective_from_at: "2026-03-01 00:00:00+00"}
          - {recipe_id: 2, route_step_id: 8, recipe_name: CMP_A, recipe_version: 1, effective_from_at: "2026-01-01 00:00:00+00"}
    expect:
      rows:
        - {recipe_id: 1, effective_to_at: "2026-02-01 00:00:00+00", is_current: false}
        - {recipe_id: 9, effective_to_at: "2026-03-01 00:00:00+00", is_current: false}
        - {recipe_id: 12, effective_to_at: null, is_current: true}
        - {recipe_id: 2, effective_to_at: null, is_current: true}

  - name: dim_lot_walks_split_lineage_to_the_root
    description: A child of a child reports under the original lot, two splits deep.
    model: dim_lot
    given:
      - input: ref('stg_lots')
        rows:
          - {lot_id: 1, lot_code: L1.1, parent_lot_id: null, product_id: 1, priority: 3, started_at: "2026-01-01 00:00:00+00", lot_status: active}
          - {lot_id: 2, lot_code: L1.2, parent_lot_id: 1, product_id: 1, priority: 3, started_at: "2026-01-02 00:00:00+00", lot_status: active}
          - {lot_id: 3, lot_code: L1.3, parent_lot_id: 2, product_id: 1, priority: 3, started_at: "2026-01-03 00:00:00+00", lot_status: hold}
          - {lot_id: 4, lot_code: L4.1, parent_lot_id: null, product_id: 2, priority: 1, started_at: "2026-01-01 00:00:00+00", lot_status: complete}
      - input: ref('stg_wafers')
        rows:
          - {wafer_id: 10, current_lot_id: 3}
          - {wafer_id: 11, current_lot_id: 3}
    expect:
      rows:
        - {lot_id: 1, root_lot_id: 1, split_depth: 0, wafer_count: 0}
        - {lot_id: 2, root_lot_id: 1, split_depth: 1, wafer_count: 0}
        - {lot_id: 3, root_lot_id: 1, split_depth: 2, wafer_count: 2}
        - {lot_id: 4, root_lot_id: 4, split_depth: 0, wafer_count: 0}
