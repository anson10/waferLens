version: 2

models:
  - name: stg_lots
    columns:
      - name: lot_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              values: ["active", "complete", "hold"]

  - name: stg_wafers
    columns:
      - name: wafer_id
        data_tests: [unique, not_null]
      - name: lot_id
        data_tests:
          - relationships:
              to: ref('stg_lots')
              field: lot_id

  - name: stg_yield_records
    columns:
      - name: record_id
        data_tests: [unique, not_null]
      - name: yield_pct
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: wafer_id
        data_tests:
          - relationships:
              to: ref('stg_wafers')
              field: wafer_id

  - name: stg_spc_flags
    columns:
      - name: flag_id
        data_tests: [unique, not_null]
