name: waferlens
version: "1.0.0"
config-version: 2
profile: waferlens

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

models:
  waferlens:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  waferlens:
    +schema: marts

data_tests:
  waferlens:
    +severity: error
