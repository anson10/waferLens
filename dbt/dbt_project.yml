name: waferlens
version: "1.0.0"
config-version: 2
profile: waferlens

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

models:
  waferlens:
    # Dashboards read with the read-only role from migration 0006.
    +grants:
      select: [grafana_reader]
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
      # Power BI imports the marts only (role from migration 0011); "+select" adds to the
      # project-wide grant instead of replacing it.
      +grants:
        +select: [powerbi_reader]

seeds:
  waferlens:
    +schema: marts
    +grants:
      select: [grafana_reader, powerbi_reader]

data_tests:
  waferlens:
    +severity: error
