repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Generated files keep the formatting their tool writes: matplotlib SVGs (docs/img) and
      # Power BI's PBIP project (no final newline; a hook "fixing" it would churn every save).
      - id: trailing-whitespace
        exclude: (\.svg$|^powerbi/WaferLens\.)
      - id: end-of-file-fixer
        exclude: (\.svg$|^powerbi/WaferLens\.)
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
