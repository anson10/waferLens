[project]
name = "waferlens"
version = "0.1.0"
description = "Fab yield excursion detection and root-cause analysis platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=18",
    "pyyaml>=6.0",
    "pandera>=0.21",
    "dagster>=1.9",
    "dagster-dbt>=0.25",
    "scipy>=1.14",
]

[dependency-groups]
dbt = [
    "dbt-core>=1.9",
    "dbt-postgres>=1.9",
]
dev = [
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "pre-commit>=4.0",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
    "pyarrow-stubs>=20.0.0.20260819",
    "dagster-webserver>=1.9",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waferlens"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations carry long SQL constraint strings.
"src/waferlens/db/migrations/versions/*" = ["E501"]
# Statistics text uses Greek letters on purpose (sigma, rho, lambda).
"src/waferlens/spc/*" = ["RUF001", "RUF002"]
"tests/unit/spc/*" = ["RUF001", "RUF002"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the Postgres/TimescaleDB container (make up)",
]

[tool.coverage.run]
source = ["waferlens"]
branch = true

[tool.uv]
default-groups = ["dev", "dbt"]
